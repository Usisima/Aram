<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Logo · pruebas</title>
    <link rel="preload" href="../../assets/fuentes/artemisia-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../../assets/fuentes/artemisia-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../../estilos.css" />
    <style>
      /* Banco de pruebas del trazado. Esta página no lleva `data-intro`, así
         que el splash no se monta encima mientras se ajusta la animación. */
      .banco {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
      }

      .banco .intro-logo {
        width: min(43.7vw, 472px);
      }

      #repetir {
        background: none;
        border: 1px solid #333;
        color: var(--tenue);
        font: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0.6rem 1.5rem;
        border-radius: 99px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
      }

      #repetir:hover {
        border-color: #666;
        color: var(--acento);
      }

      .volver {
        position: fixed;
        top: 1.5rem;
        left: 1.5rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <script src="../../assets/intro.js"></script>

    <a class="volver" href="index.html">← Inicio</a>

    <div class="banco">
      <div id="lienzo"></div>
      <button id="repetir">↺ Repetir</button>
    </div>

    <script>
      var lienzo = document.getElementById("lienzo");
      lienzo.innerHTML = AramIntro.marcado();

      var svg = lienzo.querySelector("svg");
      function repetir() {
        AramIntro.animar(svg);
      }

      document.getElementById("repetir").addEventListener("click", repetir);
      repetir();
    </script>
  </body>
</html>
