name: Publicar en GitHub Pages

# Cada push a main reconstruye el sitio y lo publica. Lo que se publica es
# exactamente lo que este guardado en el repositorio, que es el modelo que
# queremos: el editor corre en local y su salida se sube con git.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca dos publicaciones a la vez, y sin cancelar la que ya este en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # next build con output: "export" deja el sitio estatico en out/.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
